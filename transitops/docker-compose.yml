version: '3.8'

services:
  # Node.js API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transitops_api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/transitops
      - JWT_SECRET=${JWT_SECRET:-INJECT_JWT_SECRET_AT_RUNTIME}
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - transitops_network

  # MongoDB Database
  mongo:
    image: mongo:6.0
    container_name: transitops_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - transitops_network

  # Nginx Reverse Proxy & Static File Server
  nginx:
    image: nginx:alpine
    container_name: transitops_nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - transitops_network

volumes:
  mongo_data:

networks:
  transitops_network:
    driver: bridge
