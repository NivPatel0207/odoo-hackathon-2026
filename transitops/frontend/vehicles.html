<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicles | TransitOps</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    
    <div class="main-content">
      <header class="app-header">
        <div class="header-title">Vehicle Registry</div>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="modal.open('vehicle-modal')" id="btn-add-vehicle">+ Register Vehicle</button>
        </div>
      </header>

      <main class="page-content" role="main" role="main">
        <div class="filter-bar">
          <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="form-input" placeholder="Search by name or registration...">
          </div>
          <select id="filter-status" class="form-select" style="width: auto;">
            <option value="">All Statuses</option>
            <option value="available">Available</option>
            <option value="on_trip">On Trip</option>
            <option value="in_shop">In Shop</option>
            <option value="retired">Retired</option>
          </select>
        </div>

        <div class="card p-0">
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Reg. Number</th>
                  <th>Model / Name</th>
                  <th>Type</th>
                  <th>Fuel</th>
                  <th>Capacity</th>
                  <th>Acq. Cost</th>
                  <th>Odometer</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="vehicle-table-body">
                <!-- Populated by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Vehicle Modal -->
  <div id="vehicle-modal" class="modal-backdrop hidden">
    <div class="modal">
      <h2 class="modal-title">Register Vehicle</h2>
      <form id="vehicle-form" aria-label="Vehicle Form">
        <input type="hidden" id="vehicle-id">
        
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Registration Number</label>
            <input type="text" id="v-reg" class="form-input" pattern="[A-Za-z]{2}[0-9]{2}[A-Za-z]{1,3}[0-9]{4}" title="Format: GJ05AV7728" style="text-transform: uppercase;" required>
          </div>
          <div class="form-group custom-autocomplete-wrapper">
            <label class="form-label">Vehicle Name/Model</label>
            <input type="text" id="v-name" class="form-input" autocomplete="off" placeholder="Start typing... e.g. Tata Ace" required>
            <div id="v-name-dropdown" class="custom-autocomplete-dropdown"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Vehicle Type</label>
            <select id="v-type" class="form-select" required>
              <option value="truck">Truck</option>
              <option value="van">Van</option>
              <option value="bus">Bus</option>
              <option value="pickup">Pickup</option>
              <option value="trailer">Trailer</option>
              <option value="tanker">Tanker</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Fuel Type</label>
            <select id="v-fuel" class="form-select" required>
              <option value="diesel">Diesel</option>
              <option value="gasoline">Gasoline (Petrol)</option>
              <option value="cng">CNG</option>
              <option value="electric">Electric (EV)</option>
              <option value="hybrid">Hybrid</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Max Load Capacity (kg)</label>
            <input type="number" id="v-capacity" class="form-input" min="0" required>
          </div>
          <div class="form-group">
            <label class="form-label">Acquisition Cost</label>
            <input type="number" id="v-cost" class="form-input" min="0" value="0">
          </div>
          <div class="form-group">
            <label class="form-label">Initial Odometer (km)</label>
            <input type="number" id="v-odometer" class="form-input" min="0" value="0">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="modal.close('vehicle-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Vehicle</button>
        </div>
      </form>
    </div>
  </div>

  
  <script src="js/config.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/utils/debounce.js" defer></script>
  <script src="js/services/offline.js" defer></script>
  <script src="js/utils/ui-components.js" defer></script>
  <script src="js/services/api.js?v=1785860185879" defer></script>
  <script src="js/services/auth.js?v=1785860185879" defer></script>
  <script src="js/pages/vehicles.js" defer></script>
</body>
</html>
