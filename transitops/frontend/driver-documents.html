<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents | TransitOps Driver</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .page-title { font-family: 'Outfit', sans-serif; font-weight: 700; }
    
    .premium-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .doc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .doc-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      transition: all 0.2s;
    }

    .doc-card:hover {
      background: rgba(255,255,255,0.05);
      transform: translateY(-4px);
      border-color: rgba(var(--color-primary-rgb), 0.3);
    }

    .doc-icon {
      width: 48px;
      height: 48px;
      background: rgba(var(--color-primary-rgb), 0.1);
      color: var(--color-primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .doc-title {
      font-family: 'Outfit';
      font-size: 1.25rem;
      font-weight: 600;
      color: white;
      margin-bottom: 8px;
    }

    .doc-meta {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .btn-view {
      background: rgba(255,255,255,0.1);
      color: white;
      border: none;
      padding: 10px 0;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    .btn-view:hover {
      background: var(--color-primary);
      color: black;
    }

    /* Document Reader Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center; justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(8px);
    }
    .modal-content {
      background: #1a1a1a; padding: 0; border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 800px;
      height: 80vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111;
    }
    .modal-body {
      padding: 32px;
      overflow-y: auto;
      flex-grow: 1;
      color: #e5e7eb;
      line-height: 1.6;
    }
    .close-btn {
      background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;
    }

  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="app-header">
        <div class="header-left">
          <h1 class="page-title">Documents</h1>
        </div>
      </header>
      <main class="page-content">

        
        <div class="premium-card">
          <h2 style="font-family: 'Outfit'; font-size: 1.5rem; margin-bottom: 8px;">My Compliance Documents</h2>
          <p style="color: var(--color-text-muted); margin-bottom: 24px;">Upload and manage your required compliance documents (License, Medical Card, etc.).</p>
          
          <form id="upload-doc-form" style="display: flex; gap: 16px; margin-bottom: 32px; align-items: flex-end; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px;">
              <label style="display: block; font-size: 0.85rem; color: var(--color-text-muted); margin-bottom: 8px;">Document Type</label>
              <select id="doc-type" required style="width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px;">
                <option value="license">Driver License</option>
                <option value="medical_card">Medical Card</option>
                <option value="insurance">Insurance</option>
                <option value="background_check">Background Check</option>
                <option value="training_certificate">Training Certificate</option>
              </select>
            </div>
            <div style="flex: 1; min-width: 200px;">
              <label style="display: block; font-size: 0.85rem; color: var(--color-text-muted); margin-bottom: 8px;">File (PDF/Image)</label>
              <input type="file" id="doc-file" required accept="image/*,.pdf" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px;">
            </div>
            <button type="submit" style="padding: 12px 24px; background: var(--color-primary); color: black; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; height: 46px;">Upload</button>
          </form>

          <div class="doc-grid" id="doc-grid">
            <!-- Populated by JS -->
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Document Reader Modal -->
  <div class="modal-overlay" id="reader-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="reader-title" style="margin:0; font-family:'Outfit'; font-size: 1.25rem;">Document</h2>
        <button class="close-btn" onclick="document.getElementById('reader-modal').style.display='none'">&times;</button>
      </div>
      <div class="modal-body" id="reader-body">
        Loading document content...
      </div>
    </div>
  </div>

  <script src="js/config.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/utils/ui-components.js" defer></script>
  <script src="js/services/auth.js" defer></script>
  <script src="js/pages/driver-documents.js" defer></script>
</body>
</html>
