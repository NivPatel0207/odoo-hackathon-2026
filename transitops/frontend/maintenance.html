<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance | TransitOps</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    
    <div class="main-content">
      <header class="app-header">
        <div class="header-title">Maintenance Workshop</div>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="openCreateModal()" id="btn-create-maint">+ Log Maintenance</button>
        </div>
      </header>

      <main class="page-content" role="main" role="main">
        <div class="filter-bar">
          <select id="filter-status" class="form-select" style="width: 200px;">
            <option value="">All Statuses</option>
            <option value="open">Open (In Shop)</option>
            <option value="closed">Closed</option>
          </select>
        </div>

        <div class="card p-0">
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Vehicle</th>
                  <th>Description</th>
                  <th>Type</th>
                  <th>Cost (₹)</th>
                  <th>Started / Ended</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="maint-table-body">
                <!-- Populated by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create Maintenance Modal -->
  <div id="maint-modal" class="modal-backdrop hidden">
    <div class="modal" style="max-width: 600px; width: 90%;">
      <h2 class="modal-title">Log Maintenance</h2>
      <form id="maint-form" aria-label="Maint Form">
        <div class="form-grid">
          <div class="form-group" style="grid-column: 1 / -1;">
            <label class="form-label">Vehicle</label>
            <select id="m-vehicle" class="form-select" required></select>
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label class="form-label">Description of work</label>
            <input type="text" id="m-desc" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Maintenance Type</label>
            <select id="m-type" class="form-select" required>
              <option value="preventive">Preventive</option>
              <option value="corrective">Corrective</option>
              <option value="inspection">Inspection</option>
              <option value="emergency">Emergency</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="modal.close('maint-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Open Ticket (BR-9)</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Close Maintenance Modal -->
  <div id="close-modal" class="modal-backdrop hidden">
    <div class="modal" style="max-width: 400px;">
      <h2 class="modal-title">Close Maintenance</h2>
      <form id="close-form" aria-label="Close Form">
        <input type="hidden" id="c-id">
        <div class="form-group">
          <label class="form-label">Final Cost (₹)</label>
          <input type="number" id="c-cost" class="form-input" min="0" required>
        </div>
        <div class="form-group">
          <label class="form-label">Closing Notes</label>
          <textarea id="c-notes" class="form-textarea" rows="3"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="modal.close('close-modal')">Cancel</button>
          <button type="submit" class="btn btn-success">Close & Release (BR-10)</button>
        </div>
      </form>
    </div>
  </div>

  
  <script src="js/config.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/utils/debounce.js" defer></script>
  <script src="js/services/offline.js" defer></script>
  <script src="js/utils/ui-components.js" defer></script>
  <script src="js/services/api.js?v=1785860185879" defer></script>
  <script src="js/services/auth.js?v=1785860185879" defer></script>
  <script src="js/pages/maintenance.js" defer></script>
</body>
</html>
