<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error | TransitOps</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-6);
      background: var(--color-bg-primary);
    }
    .error-code {
      font-size: 8rem;
      font-weight: 800;
      font-family: var(--font-heading);
      background: linear-gradient(135deg, var(--color-accent-amber), var(--color-danger));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: var(--space-4);
      filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.2));
    }
    .error-title {
      font-size: 2rem;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: var(--space-2);
    }
    .error-msg {
      font-size: 1.1rem;
      color: var(--color-text-secondary);
      max-width: 500px;
      margin-bottom: var(--space-8);
      line-height: 1.6;
    }
    .error-illustration {
      width: 120px;
      height: 120px;
      margin-bottom: var(--space-6);
      color: var(--color-text-muted);
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="error-page">
    <div id="illustration"></div>
    <div class="error-code" id="err-code">404</div>
    <h1 class="error-title" id="err-title">Page Not Found</h1>
    <p class="error-msg" id="err-msg">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    
    <button class="btn btn-primary btn-lg" onclick="window.location.href='dashboard.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Return to Dashboard
    </button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || '404';
    
    const errors = {
      '403': {
        title: 'Access Denied',
        msg: 'You do not have the required permissions to view this page. If you believe this is a mistake, please contact your administrator.',
        svg: '<svg class="error-illustration" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>'
      },
      '404': {
        title: 'Page Not Found',
        msg: 'The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.',
        svg: '<svg class="error-illustration" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>'
      },
      '500': {
        title: 'Server Error',
        msg: 'Our servers are currently experiencing issues. Please try again later.',
        svg: '<svg class="error-illustration" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>'
      }
    };

    const config = errors[code] || errors['404'];
    
    document.getElementById('err-code').textContent = code;
    document.getElementById('err-title').textContent = config.title;
    document.getElementById('err-msg').textContent = config.msg;
    document.getElementById('illustration').innerHTML = config.svg;
    document.title = `${code} ${config.title} | TransitOps`;
  </script>
</body>
</html>
