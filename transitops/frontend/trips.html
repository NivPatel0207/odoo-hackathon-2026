<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trips | TransitOps</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    
    <div class="main-content">
      <header class="app-header">
        <div class="header-title">Trip Management</div>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="openCreateModal()" id="btn-create-trip">+ Create Draft Trip</button>
        </div>
      </header>

      <main class="page-content">
        <div class="filter-bar">
          <select id="filter-status" class="form-select" style="width: 200px;">
            <option value="">All Statuses</option>
            <option value="draft">Draft</option>
            <option value="dispatched">Dispatched</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div class="card p-0">
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Trip Code</th>
                  <th>Route</th>
                  <th>Vehicle & Driver</th>
                  <th>Cargo</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="trip-table-body">
                <!-- Populated by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create/Edit Trip Modal -->
  <div id="trip-modal" class="modal-backdrop hidden">
    <div class="modal">
      <h2 class="modal-title">Trip Details</h2>
      <form id="trip-form">
        <input type="hidden" id="t-id">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Source Location</label>
            <input type="text" id="t-source" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Destination</label>
            <input type="text" id="t-destination" class="form-input" required>
          </div>
          <div class="form-group col-span-12">
            <label class="form-label">Assign Vehicle</label>
            <select id="t-vehicle" class="form-select" required></select>
          </div>
          <div class="form-group col-span-12">
            <label class="form-label">Assign Driver</label>
            <select id="t-driver" class="form-select" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Cargo Weight (kg)</label>
            <input type="number" id="t-cargo" class="form-input" min="0" required>
          </div>
          <div class="form-group">
            <label class="form-label">Planned Distance (km)</label>
            <input type="number" id="t-distance" class="form-input" min="0">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="modal.close('trip-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Draft</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Complete Trip Modal -->
  <div id="complete-modal" class="modal-backdrop hidden">
    <div class="modal" style="max-width: 400px;">
      <h2 class="modal-title">Complete Trip</h2>
      <form id="complete-form">
        <input type="hidden" id="c-id">
        <div class="form-group">
          <label class="form-label">Actual Distance (km)</label>
          <input type="number" id="c-distance" class="form-input" min="0" required>
        </div>
        <div class="form-group">
          <label class="form-label">Fuel Consumed (Liters)</label>
          <input type="number" id="c-fuel" class="form-input" min="0" step="0.1" required>
        </div>
        <div class="form-group">
          <label class="form-label">Generated Revenue (₹)</label>
          <input type="number" id="c-revenue" class="form-input" min="0" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="modal.close('complete-modal')">Cancel</button>
          <button type="submit" class="btn btn-success">Mark Completed</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/trips.js"></script>
</body>
</html>
