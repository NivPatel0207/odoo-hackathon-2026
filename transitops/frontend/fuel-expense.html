<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuel & Expenses | TransitOps</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    
    <div class="main-content">
      <header class="app-header">
        <div class="header-title">Fuel & Expenses</div>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="modal.open('fuel-modal')" id="btn-log-fuel">+ Log Fuel</button>
          <button class="btn btn-secondary" onclick="modal.open('expense-modal')" id="btn-log-exp">+ Log Expense</button>
        </div>
      </header>

      <main class="page-content">
        
        <div class="dashboard-grid">
          <div class="col-span-6 card p-0">
            <div class="card-header p-5 pb-0 border-b-0">
              <h3 class="card-title">Recent Fuel Logs</h3>
            </div>
            <div class="table-wrapper border-0 mt-4" style="max-height: 400px; overflow-y: auto;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Vehicle</th>
                    <th>Liters</th>
                    <th>Cost</th>
                  </tr>
                </thead>
                <tbody id="fuel-table-body">
                  <!-- Populated by JS -->
                </tbody>
              </table>
            </div>
          </div>

          <div class="col-span-6 card p-0">
            <div class="card-header p-5 pb-0 border-b-0">
              <h3 class="card-title">Recent Miscellaneous Expenses</h3>
            </div>
            <div class="table-wrapper border-0 mt-4" style="max-height: 400px; overflow-y: auto;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Vehicle</th>
                    <th>Type</th>
                    <th>Cost</th>
                  </tr>
                </thead>
                <tbody id="expense-table-body">
                  <!-- Populated by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Fuel Modal -->
  <div id="fuel-modal" class="modal-backdrop hidden">
    <div class="modal" style="max-width: 450px;">
      <h2 class="modal-title">Log Fuel Purchase</h2>
      <form id="fuel-form">
        <div class="form-group">
          <label class="form-label">Vehicle</label>
          <select id="f-vehicle" class="form-select" required></select>
        </div>
        <div class="form-group">
          <label class="form-label">Associated Trip (Optional)</label>
          <select id="f-trip" class="form-select">
            <option value="">None / General</option>
          </select>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Quantity (Liters)</label>
            <input type="number" id="f-liters" class="form-input" min="0" step="0.1" required>
          </div>
          <div class="form-group">
            <label class="form-label">Total Cost (₹)</label>
            <input type="number" id="f-cost" class="form-input" min="0" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" id="f-date" class="form-input" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="modal.close('fuel-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Fuel Log</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Expense Modal -->
  <div id="expense-modal" class="modal-backdrop hidden">
    <div class="modal" style="max-width: 450px;">
      <h2 class="modal-title">Log Expense</h2>
      <form id="expense-form">
        <div class="form-group">
          <label class="form-label">Vehicle</label>
          <select id="e-vehicle" class="form-select" required></select>
        </div>
        <div class="form-group">
          <label class="form-label">Expense Type</label>
          <select id="e-type" class="form-select" required>
            <option value="toll">Toll</option>
            <option value="insurance">Insurance</option>
            <option value="tax">Tax / Registration</option>
            <option value="fine">Fine / Penalty</option>
            <option value="parking">Parking</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Amount (₹)</label>
          <input type="number" id="e-amount" class="form-input" min="0" required>
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" id="e-date" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <input type="text" id="e-desc" class="form-input" placeholder="Optional details">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="modal.close('expense-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/fuelExpense.js"></script>
</body>
</html>
