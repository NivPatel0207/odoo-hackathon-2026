<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation / Tracking | TransitOps Driver</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; overflow: hidden; }
    
    #map {
      position: absolute;
      top: var(--header-height);
      left: var(--sidebar-width);
      right: 0;
      bottom: 0;
      z-index: 1;
    }

    /* Floating Panel */
    .tracking-overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 380px;
      z-index: 1000;
      background: linear-gradient(145deg, rgba(20, 20, 20, 0.85) 0%, rgba(10, 10, 10, 0.95) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      pointer-events: auto;
    }

    .trip-meta-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--color-text-muted);
      margin-bottom: 4px;
    }

    .trip-meta-value {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .tracking-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-action {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: rgba(255,255,255,0.15);
    }

    .btn-action.primary {
      background: rgba(var(--color-primary-rgb), 0.15);
      color: var(--color-primary);
      border-color: rgba(var(--color-primary-rgb), 0.3);
    }
    .btn-action.primary:hover {
      background: rgba(var(--color-primary-rgb), 0.25);
    }
    
    .btn-action.danger {
      background: rgba(220, 38, 38, 0.15);
      color: #fca5a5;
      border-color: rgba(220, 38, 38, 0.3);
    }
    .btn-action.danger:hover {
      background: rgba(220, 38, 38, 0.25);
    }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center; justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: #111;
      padding: 32px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      width: 100%;
      max-width: 400px;
    }

    .modal-content h2 { margin-top: 0; margin-bottom: 24px; font-family: 'Outfit'; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 8px; color: var(--color-text-muted); }
    .form-group select, .form-group textarea {
      width: 100%; padding: 12px; border-radius: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: white; font-family: inherit;
    }
    .form-group select option, select option {
      background-color: #111827;
      color: #ffffff;
      padding: 8px 12px;
    }

    .btn-submit { background: var(--color-primary); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    
    /* Responsive adjustment for app layout */
    .main-content { position: relative; padding: 0 !important; }
    .app-header { display: none; } /* Hide standard header for full screen map */
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      
      <div id="map"></div>
      
      <!-- No active trip state -->
      <div id="no-trip-overlay" style="display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; flex-direction: column;">
        <h2 style="font-family: 'Outfit'; font-size: 2rem; margin-bottom: 16px;">No Active Trip</h2>
        <p style="color: var(--color-text-muted);">You don't have a trip currently in progress to track.</p>
        <button onclick="window.location.href='driver-trips.html'" style="margin-top: 24px; background: var(--color-primary); color: #000; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer;">Go to My Trips</button>
      </div>

      <div class="tracking-overlay" id="tracking-panel" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
          <div>
            <div class="trip-meta-label">Currently Navigating</div>
            <div class="trip-meta-value" style="font-family: 'Outfit'; font-size: 1.5rem;" id="nav-route">--</div>
          </div>
          <span class="status-badge" style="background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; color: #fff;" id="nav-status">--</span>
        </div>

        <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 16px; border-radius: 16px; margin-bottom: 20px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div>
              <div class="trip-meta-label">ETA</div>
              <div class="trip-meta-value" id="nav-eta" style="color: var(--color-primary);">--</div>
            </div>
            <div>
              <div class="trip-meta-label">Distance Rem.</div>
              <div class="trip-meta-value" id="nav-dist">-- mi</div>
            </div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding: 16px; border-radius: 16px; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2);">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          <div>
            <div style="color: #3b82f6; font-weight: 600; font-size: 1.1rem;" id="nav-turn">Continue straight</div>
            <div style="color: rgba(255,255,255,0.6); font-size: 0.9rem;">for 4.2 miles</div>
          </div>
        </div>

        <div class="tracking-actions">
          <button class="btn-action primary" onclick="pingLocation()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
            Ping Location
          </button>
          <button class="btn-action danger" onclick="document.getElementById('delay-modal').style.display='flex'">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            Report Delay
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Delay Modal -->
  <div class="modal-overlay" id="delay-modal">
    <div class="modal-content">
      <h2>Report Delay / Traffic</h2>
      <form id="delay-form">
        <div class="form-group">
          <label>Reason for Delay</label>
          <select id="delay-reason" required>
            <option value="Traffic">Heavy Traffic</option>
            <option value="Weather">Severe Weather</option>
            <option value="Breakdown">Vehicle Breakdown</option>
            <option value="Accident">Accident on Route</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Additional Details</label>
          <textarea id="delay-notes" rows="3" placeholder="Provide more context..."></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <button type="button" class="btn-cancel" onclick="document.getElementById('delay-modal').style.display='none'">Cancel</button>
          <button type="submit" class="btn-submit">Submit Report</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script src="js/config.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/utils/ui-components.js" defer></script>
  <script src="js/services/api.js" defer></script>
  <script src="js/services/auth.js" defer></script>
  <script src="js/pages/driver-tracking.js" defer></script>
</body>
</html>
