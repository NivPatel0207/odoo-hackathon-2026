<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tracking | TransitOps</title>
  
  <!-- Maps are loaded at the bottom -->
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    #map {
      width: 100%;
      height: calc(100vh - var(--header-height) - 64px);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      z-index: 10;
    }
    
    /* Custom InfoWindow styling for Google Maps */
    .gm-style-iw.gm-style-iw-c {
      background: var(--color-bg-card) !important;
      color: var(--color-text-primary) !important;
      border: 1px solid var(--color-border) !important;
      border-radius: var(--radius-md) !important;
      padding: 0 !important;
      box-shadow: var(--shadow-lg) !important;
    }
    .gm-style-iw-tc::after {
      background: var(--color-bg-card) !important;
    }
    .gm-style-iw-d {
      overflow: hidden !important;
      padding: 12px !important;
    }
    .gm-ui-hover-effect {
      filter: invert(1) !important; /* Make close button visible on dark */
    }

    /* Pulsing Radar Marker */
    .radar-marker {
      width: 16px !important;
      height: 16px !important;
      background: var(--color-accent-amber);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 10px var(--color-accent-amber);
      margin-left: -8px;
      margin-top: -8px;
      transition: all 1s linear; /* Smooth movement */
    }
    .radar-marker::after {
      content: '';
      position: absolute;
      top: -12px; left: -12px; bottom: -12px; right: -12px;
      border: 2px solid var(--color-accent-amber);
      border-radius: 50%;
      animation: radarPulse 2s infinite ease-out;
    }
    @keyframes radarPulse {
      0% { transform: scale(0.3); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    
    /* HUD Overlay */
    .map-hud {
      position: absolute;
      top: var(--space-4);
      right: var(--space-4);
      z-index: 1000;
      background: rgba(26, 34, 54, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      width: 250px;
      box-shadow: var(--shadow-lg);
      --color-text-primary: #ffffff;
      --color-text-secondary: rgba(255, 255, 255, 0.7);
    }
    .hud-title {
      font-family: var(--font-heading);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: var(--space-3);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: var(--space-2);
    }
    .hud-stat {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--space-2);
      font-size: 0.8rem;
    }
    .hud-stat-label { color: var(--color-text-secondary); }
    .hud-stat-val { font-weight: 700; color: var(--color-accent-amber); }

    /* Custom Truck Icon Styles */
    .truck-marker {
      background: var(--color-bg-card);
      border: 2px solid var(--color-accent-amber);
      border-radius: var(--radius-full);
      width: 30px !important;
      height: 30px !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: var(--shadow-glow-amber);
      margin-left: -15px;
      margin-top: -15px;
      transition: all 1s linear; /* Smooth movement */
    }
    

    .truck-popup-title {
      font-family: var(--font-heading);
      font-weight: 700;
      color: var(--color-accent-amber);
      margin-bottom: 4px;
      font-size: 14px;
    }
    .truck-popup-body {
      font-size: 12px;
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    
    <div class="main-content">
      <header class="app-header">
        <div class="header-title">Live GPS Telematics</div>
        <div class="header-actions">
          <span class="badge badge-dispatched" id="active-count">0 Active Trucks</span>
        </div>
      </header>

      <main class="page-content" role="main" role="main" style="padding-bottom: 0; position: relative;">
        <!-- HUD Overlay -->
        <div class="map-hud">
          <div class="hud-title">Fleet Telemetry</div>
          <div class="hud-stat">
            <span class="hud-stat-label">Active Dispatches</span>
            <span class="hud-stat-val" id="hud-active">0</span>
          </div>
          <div class="hud-stat">
            <span class="hud-stat-label">Total Cargo Moving</span>
            <span class="hud-stat-val" id="hud-cargo">0 kg</span>
          </div>
          <div class="hud-stat">
            <span class="hud-stat-label">System Health</span>
            <span class="hud-stat-val text-success" style="color: #10b981;">Optimal</span>
          </div>
        </div>

        <div id="map"></div>
      </main>
    </div>
  </div>

  <!-- Google Maps JS API -->
  <script src="https://maps.googleapis.com/maps/api/js?v=weekly" defer></script>

  
  <script src="js/config.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/utils/debounce.js" defer></script>
  <script src="js/services/offline.js" defer></script>
  <script src="js/utils/ui-components.js" defer></script>
  <script src="js/services/api.js?v=1785860185879" defer></script>
  <script src="js/services/auth.js?v=1785860185879" defer></script>
  <script src="js/pages/tracking.js" defer></script>
</body>
</html>
